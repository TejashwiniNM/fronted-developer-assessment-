<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 2 - Video Chapters</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #ff0000;
            --dark: #0f0f0f;
            --gray: #272727;
            --light-gray: #aaaaaa;
            --white: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--dark);
            color: var(--white);
            min-height: 100vh;
        }

        .nav-back {
            display: inline-block;
            padding: 1rem 2rem;
            color: var(--white);
            text-decoration: none;
            font-weight: 500;
        }

        .nav-back:hover {
            color: var(--primary);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 2rem 2rem;
        }

        h1 {
            text-align: center;
            margin-bottom: 2rem;
            font-weight: 700;
        }

        /* Main Player Section */
        .player-section {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 2rem;
            margin-bottom: 3rem;
        }

        /* Video Container */
        .video-wrapper {
            position: relative;
            background: var(--gray);
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 16/9;
        }

        .video-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Chapter Overlay */
        .chapter-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
            padding: 2rem 1rem 1rem;
            transform: translateY(100%);
            transition: transform 0.3s ease;
        }

        .video-wrapper:hover .chapter-overlay {
            transform: translateY(0);
        }

        .chapter-title-display {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--white);
        }

        /* Chapter Timeline */
        .chapter-timeline {
            display: flex;
            height: 4px;
            background: rgba(255,255,255,0.2);
            border-radius: 2px;
            margin-top: 1rem;
            cursor: pointer;
            position: relative;
        }

        .chapter-segment {
            height: 100%;
            position: relative;
            transition: background 0.2s;
        }

        .chapter-segment:hover {
            background: var(--primary) !important;
        }

        .chapter-segment::after {
            content: attr(data-title);
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.7rem;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.2s;
            background: rgba(0,0,0,0.8);
            padding: 2px 6px;
            border-radius: 4px;
            pointer-events: none;
        }

        .chapter-segment:hover::after {
            opacity: 1;
        }

        /* Progress bar */
        .progress-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            background: var(--primary);
            border-radius: 2px;
            pointer-events: none;
            transition: width 0.1s linear;
        }

        /* Chapters Sidebar */
        .chapters-sidebar {
            background: var(--gray);
            border-radius: 12px;
            padding: 1.5rem;
            max-height: 600px;
            overflow-y: auto;
        }

        .chapters-sidebar h3 {
            margin-bottom: 1rem;
            font-size: 1.2rem;
        }

        .chapter-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.75rem;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            margin-bottom: 0.5rem;
        }

        .chapter-item:hover {
            background: rgba(255,255,255,0.1);
        }

        .chapter-item.active {
            background: rgba(255,0,0,0.2);
            border-left: 3px solid var(--primary);
        }

        .chapter-time {
            font-size: 0.85rem;
            color: var(--primary);
            font-weight: 600;
            min-width: 50px;
        }

        .chapter-name {
            font-size: 0.9rem;
            color: var(--white);
        }

        /* Video Carousel */
        .carousel-section {
            margin-top: 3rem;
        }

        .carousel-section h2 {
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
        }

        .video-carousel {
            display: flex;
            gap: 1rem;
            overflow-x: auto;
            padding-bottom: 1rem;
            scrollbar-width: thin;
            scrollbar-color: var(--gray) var(--dark);
        }

        .video-carousel::-webkit-scrollbar {
            height: 8px;
        }

        .video-carousel::-webkit-scrollbar-track {
            background: var(--dark);
        }

        .video-carousel::-webkit-scrollbar-thumb {
            background: var(--gray);
            border-radius: 4px;
        }

        .video-thumb {
            min-width: 280px;
            background: var(--gray);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 2px solid transparent;
        }

        .video-thumb:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .video-thumb.active {
            border-color: var(--primary);
        }

        /* Pure CSS Thumbnails */
        .thumb-image {
            width: 100%;
            aspect-ratio: 16/9;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .thumb-pattern {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .pattern-1 {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .pattern-2 {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        }

        .pattern-3 {
            background: linear-gradient(135deg, #2193b0 0%, #6dd5ed 100%);
        }

        .play-icon {
            position: absolute;
            width: 50px;
            height: 50px;
            background: rgba(255,255,255,0.9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }

        .play-icon::after {
            content: '';
            width: 0;
            height: 0;
            border-left: 18px solid var(--primary);
            border-top: 10px solid transparent;
            border-bottom: 10px solid transparent;
            margin-left: 4px;
        }

        .thumb-duration {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(0,0,0,0.8);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.8rem;
            z-index: 2;
        }

        .thumb-info {
            padding: 1rem;
        }

        .thumb-title {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .thumb-meta {
            font-size: 0.8rem;
            color: var(--light-gray);
        }

        /* Auto-Generate Section */
        .auto-generate {
            margin-top: 3rem;
            background: var(--gray);
            border-radius: 12px;
            padding: 2rem;
        }

        .auto-generate h2 {
            margin-bottom: 1rem;
        }

        .input-group {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .input-group input {
            flex: 1;
            padding: 0.75rem 1rem;
            border: 1px solid #444;
            border-radius: 8px;
            background: var(--dark);
            color: var(--white);
            font-size: 1rem;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .btn {
            padding: 0.75rem 1.5rem;
            background: var(--primary);
            color: var(--white);
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background: #cc0000;
        }

        .btn:disabled {
            background: #666;
            cursor: not-allowed;
        }

        .generated-chapters {
            display: none;
        }

        .generated-chapters.show {
            display: block;
        }

        .chapter-tag {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(255,0,0,0.15);
            border: 1px solid var(--primary);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            margin: 0.25rem;
            font-size: 0.9rem;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 2rem;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 968px) {
            .player-section {
                grid-template-columns: 1fr;
            }
            
            .chapters-sidebar {
                max-height: 300px;
            }
        }

        @media (max-width: 600px) {
            .container {
                padding: 0 1rem 1rem;
            }
            
            .input-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <a href="../index.html" class="nav-back">← Back to Home</a>
    
    <div class="container">
        <h1>Video Chapters Player</h1>

        <div class="player-section">
            <!-- Main Video Player -->
            <div class="video-wrapper" id="mainPlayer">
                <iframe 
                    id="youtubePlayer"
                    src="https://www.youtube.com/embed/RJTCAL1DRro?enablejsapi=1" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    allowfullscreen>
                </iframe>
                
                <!-- Chapter Overlay -->
                <div class="chapter-overlay">
                    <div class="chapter-title-display" id="currentChapterTitle">Introduction</div>
                    <div class="chapter-timeline" id="chapterTimeline">
                        <div class="progress-bar" id="progressBar" style="width: 0%"></div>
                    </div>
                </div>
            </div>

            <!-- Chapters Sidebar -->
            <div class="chapters-sidebar">
                <h3>📑 Chapters</h3>
                <div id="chaptersList">
                    <!-- Populated by JS -->
                </div>
            </div>
        </div>

        <!-- Video Carousel -->
        <div class="carousel-section">
            <h2>More Videos</h2>
            <div class="video-carousel" id="videoCarousel">
                <!-- Populated by JS -->
            </div>
        </div>

        <!-- Auto-Generate Chapters -->
        <div class="auto-generate">
            <h2>🤖 Auto-Generate Chapters</h2>
            <p style="color: var(--light-gray); margin-bottom: 1rem;">
                Enter a YouTube URL to automatically detect chapter points using video analysis.
            </p>
            <div class="input-group">
                <input 
                    type="text" 
                    id="youtubeUrl" 
                    placeholder="https://www.youtube.com/watch?v=..."
                >
                <button class="btn" id="generateBtn" onclick="generateChapters()">
                    Generate Chapters
                </button>
            </div>
            
            <div class="loading" id="loadingIndicator">
                <div class="spinner"></div>
                <p>Analyzing video content and detecting scene changes...</p>
            </div>

            <div class="generated-chapters" id="generatedResults">
                <h3 style="margin-bottom: 1rem;">Detected Chapters:</h3>
                <div id="chaptersOutput"></div>
            </div>
        </div>
    </div>

    <script>
        

        (function() {
            'use strict';

            
            //  3 VIDEOS 
            
            const videoLibrary = [
                {
                    id: 'RJTCAL1DRro',
                    title: 'Video 1 - Educational Content',
                    duration: '8:45',
                    patternClass: 'pattern-1',
                    chapters: [
                        { time: 0, title: 'Introduction' },
                        { time: 45, title: 'Core Concepts' },
                        { time: 180, title: 'Deep Dive' },
                        { time: 340, title: 'Examples' },
                        { time: 450, title: 'Summary' },
                        { time: 525, title: 'Conclusion' }
                    ]
                },
                {
                    id: 'jj_aUFX8SV8',
                    title: 'Video 2 - Tutorial Series',
                    duration: '12:30',
                    patternClass: 'pattern-2',
                    chapters: [
                        { time: 0, title: 'Getting Started' },
                        { time: 90, title: 'Setup Process' },
                        { time: 240, title: 'Main Tutorial' },
                        { time: 480, title: 'Advanced Tips' },
                        { time: 600, title: 'Troubleshooting' },
                        { time: 720, title: 'Final Notes' },
                        { time: 750, title: 'Outro' }
                    ]
                },
                {
                    id: 'xmmxkmVSiq0',
                    title: 'Video 3 - Product Demo',
                    duration: '6:15',
                    patternClass: 'pattern-3',
                    chapters: [
                        { time: 0, title: 'Welcome' },
                        { time: 30, title: 'Product Overview' },
                        { time: 150, title: 'Key Features' },
                        { time: 280, title: 'Use Cases' },
                        { time: 350, title: 'Pricing' },
                        { time: 375, title: 'Call to Action' }
                    ]
                }
            ];

           
            // STATE
           
            let currentVideoIndex = 0;
            let currentTime = 0;
            let isPlaying = false;
            let updateInterval = null;

           
            // DOM ELEMENTS
            
            const youtubePlayer = document.getElementById('youtubePlayer');
            const chaptersList = document.getElementById('chaptersList');
            const chapterTimeline = document.getElementById('chapterTimeline');
            const progressBar = document.getElementById('progressBar');
            const currentChapterTitle = document.getElementById('currentChapterTitle');
            const videoCarousel = document.getElementById('videoCarousel');

            // INITIALIZATION

            function init() {
                renderCarousel();
                loadVideo(0);
                startTimeTracking();
            }

          
            // VIDEO LOADING
            

            function loadVideo(index) {
                currentVideoIndex = index;
                const video = videoLibrary[index];
                
                youtubePlayer.src = `https://www.youtube.com/embed/${video.id}?enablejsapi=1`;
                
                renderChapters(video.chapters);
                renderTimeline(video.chapters, parseDuration(video.duration));
                updateActiveThumbnail(index);
                
                currentTime = 0;
                progressBar.style.width = '0%';
                isPlaying = false;
            }

            function parseDuration(durationStr) {
                const parts = durationStr.split(':').map(Number);
                if (parts.length === 2) {
                    return parts[0] * 60 + parts[1];
                }
                return parts[0] * 3600 + parts[1] * 60 + parts[2];
            }

            function formatTime(seconds) {
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                return `${mins}:${secs.toString().padStart(2, '0')}`;
            }

            
            // RENDER: Chapters Sidebar
           

            function renderChapters(chapters) {
                chaptersList.innerHTML = '';
                
                chapters.forEach((chapter, index) => {
                    const item = document.createElement('div');
                    item.className = 'chapter-item';
                    item.dataset.index = index;
                    item.dataset.time = chapter.time;
                    
                    item.innerHTML = `
                        <span class="chapter-time">${formatTime(chapter.time)}</span>
                        <span class="chapter-name">${chapter.title}</span>
                    `;
                    
                    item.addEventListener('click', () => {
                        seekToChapter(chapter.time);
                    });
                    
                    chaptersList.appendChild(item);
                });
            }

            
            // RENDER: Timeline
            

            function renderTimeline(chapters, totalDuration) {
                const segments = chapterTimeline.querySelectorAll('.chapter-segment');
                segments.forEach(s => s.remove());
                
                chapters.forEach((chapter, index) => {
                    const nextTime = chapters[index + 1] ? chapters[index + 1].time : totalDuration;
                    const duration = nextTime - chapter.time;
                    const percentage = (duration / totalDuration) * 100;
                    
                    const segment = document.createElement('div');
                    segment.className = 'chapter-segment';
                    segment.style.width = percentage + '%';
                    segment.style.background = `hsl(${200 + (index * 30)}, 70%, 50%)`;
                    segment.dataset.title = chapter.title;
                    segment.dataset.time = chapter.time;
                    
                    segment.addEventListener('click', (e) => {
                        e.stopPropagation();
                        seekToChapter(chapter.time);
                    });
                    
                    chapterTimeline.insertBefore(segment, progressBar);
                });
            }

            
            // RENDER: Video Carousel ( CSS)
            

            function renderCarousel() {
                videoCarousel.innerHTML = '';
                
                videoLibrary.forEach((video, index) => {
                    const thumb = document.createElement('div');
                    thumb.className = 'video-thumb';
                    thumb.dataset.index = index;
                    
                    thumb.innerHTML = `
                        <div class="thumb-image">
                            <div class="thumb-pattern ${video.patternClass}"></div>
                            <div class="play-icon"></div>
                            <span class="thumb-duration">${video.duration}</span>
                        </div>
                        <div class="thumb-info">
                            <div class="thumb-title">${video.title}</div>
                            <div class="thumb-meta">${video.chapters.length} chapters</div>
                        </div>
                    `;
                    
                    thumb.addEventListener('click', () => loadVideo(index));
                    videoCarousel.appendChild(thumb);
                });
            }

            function updateActiveThumbnail(index) {
                document.querySelectorAll('.video-thumb').forEach((thumb, i) => {
                    thumb.classList.toggle('active', i === index);
                });
            }

            
            // PLAYER CONTROLS
           

            function seekToChapter(time) {
                const video = videoLibrary[currentVideoIndex];
                youtubePlayer.src = `https://www.youtube.com/embed/${video.id}?start=${time}&autoplay=1`;
                currentTime = time;
                isPlaying = true;
            }

            
            // TIME TRACKING (Polling)
            

            function startTimeTracking() {
                updateInterval = setInterval(() => {
                    if (isPlaying) {
                        currentTime += 1;
                        updateChapterHighlight();
                        updateProgress();
                    }
                }, 1000);
            }

            function updateChapterHighlight() {
                const video = videoLibrary[currentVideoIndex];
                const chapters = video.chapters;
                
                let currentChapterIndex = 0;
                for (let i = chapters.length - 1; i >= 0; i--) {
                    if (currentTime >= chapters[i].time) {
                        currentChapterIndex = i;
                        break;
                    }
                }
                
                document.querySelectorAll('.chapter-item').forEach((item, index) => {
                    item.classList.toggle('active', index === currentChapterIndex);
                });
                
                if (currentChapterTitle) {
                    currentChapterTitle.textContent = chapters[currentChapterIndex].title;
                }
                
                const activeItem = document.querySelector('.chapter-item.active');
                if (activeItem) {
                    activeItem.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }
            }

            function updateProgress() {
                const video = videoLibrary[currentVideoIndex];
                const totalSeconds = parseDuration(video.duration);
                const percentage = Math.min((currentTime / totalSeconds) * 100, 100);
                progressBar.style.width = percentage + '%';
            }

           
            // AUTO-GENERATE CHAPTERS
            

            window.generateChapters = function() {
                const urlInput = document.getElementById('youtubeUrl');
                const loading = document.getElementById('loadingIndicator');
                const results = document.getElementById('generatedResults');
                const output = document.getElementById('chaptersOutput');
                const btn = document.getElementById('generateBtn');
                
                const url = urlInput.value.trim();
                
                if (!url || !isValidYouTubeUrl(url)) {
                    alert('Please enter a valid YouTube URL');
                    return;
                }
                
                const videoId = extractVideoId(url);
                
                loading.classList.add('show');
                results.classList.remove('show');
                btn.disabled = true;
                
                setTimeout(() => {
                    loading.classList.remove('show');
                    btn.disabled = false;
                    
                    const generatedChapters = simulateChapterDetection(videoId);
                    
                    output.innerHTML = generatedChapters.map(ch => `
                        <span class="chapter-tag">
                            <strong>${formatTime(ch.time)}</strong> - ${ch.title}
                        </span>
                    `).join('');
                    
                    results.classList.add('show');
                    
                    addToLibrary(videoId, generatedChapters);
                    
                }, 3000);
            };

            function isValidYouTubeUrl(url) {
                return /^(https?:\/\/)?(www\.)?(youtube\.com|youtu\.be)/.test(url);
            }

            function extractVideoId(url) {
                const match = url.match(/(?:v=|\/)([a-zA-Z0-9_-]{11})/);
                return match ? match[1] : null;
            }

            function simulateChapterDetection(videoId) {
            
                
                let seed = videoId.split('').reduce((a, b) => a + b.charCodeAt(0), 0);
                const random = () => {
                    seed = (seed * 9301 + 49297) % 233280;
                    return seed / 233280;
                };
                
                const duration = 180 + Math.floor(random() * 300);
                const numChapters = 4 + Math.floor(random() * 4);
                
                const templates = [
                    ['Introduction', 'Main Topic', 'Deep Dive', 'Examples', 'Case Study', 'Summary', 'Conclusion'],
                    ['Opening', 'Setup', 'Tutorial Start', 'Advanced Features', 'Tips & Tricks', 'Wrap Up'],
                    ['Intro', 'Problem Statement', 'Solution', 'Implementation', 'Testing', 'Results', 'Outro']
                ];
                
                const template = templates[Math.floor(random() * templates.length)];
                const chapters = [];
                
                for (let i = 0; i < Math.min(numChapters, template.length); i++) {
                    const time = i === 0 ? 0 : Math.floor((duration / numChapters) * i + random() * 10);
                    chapters.push({
                        time: time,
                        title: template[i]
                    });
                }
                
                return chapters;
            }

            function addToLibrary(videoId, chapters) {
                const patterns = ['pattern-1', 'pattern-2', 'pattern-3'];
                const newVideo = {
                    id: videoId,
                    title: `Auto-Generated (${videoId})`,
                    duration: formatTime(chapters[chapters.length - 1].time + 60),
                    patternClass: patterns[videoLibrary.length % patterns.length],
                    chapters: chapters
                };
                
                videoLibrary.push(newVideo);
                renderCarousel();
                loadVideo(videoLibrary.length - 1);
            }

            window.addEventListener('message', (event) => {
                if (event.data && typeof event.data === 'string') {
                    try {
                        const data = JSON.parse(event.data);
                        if (data.event === 'onStateChange') {
                            isPlaying = data.info === 1;
                        }
                    } catch (e) {}
                }
            });

            init();

        })();
    </script>
</body>
</html>
