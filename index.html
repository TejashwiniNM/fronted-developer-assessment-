<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Front End Developer Internship Assignment</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0f172a;
            color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .container {
            text-align: center;
            max-width: 800px;
            width: 100%;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            font-weight: 800;
            background: linear-gradient(90deg, #f97316, #e8590a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: #94a3b8;
            margin-bottom: 3rem;
            font-size: 1.1rem;
        }

        .tech-stack {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 3rem;
            flex-wrap: wrap;
        }

        .tech-tag {
            background: rgba(99, 102, 241, 0.15);
            color: #818cf8;
            padding: 0.5rem 1.25rem;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 500;
            border: 1px solid rgba(99, 102, 241, 0.3);
        }

        .tasks {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .task-link {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 2rem 1.5rem;
            text-decoration: none;
            color: #f1f5f9;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.75rem;
        }

        .task-link:hover {
            transform: translateY(-4px);
            border-color: #6366f1;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .task-number {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            font-weight: 700;
            color: white;
        }

        .task-name {
            font-size: 1.15rem;
            font-weight: 600;
        }

        .task-desc {
            font-size: 0.85rem;
            color: #94a3b8;
        }

        @media (max-width: 600px) {
            h1 { font-size: 1.8rem; }
            .tasks { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Internship Assignment</h1>
        <p class="subtitle">Front End Developer — 3 Tasks</p>
        
        <div class="tech-stack">
            <span class="tech-tag">HTML</span>
            <span class="tech-tag">CSS</span>
            <span class="tech-tag">JavaScript</span>
        </div>

        <div class="tasks">
            <a href="./TASK 1/index.html" class="task-link">
                <div class="task-number">1</div>
                <div class="task-name">Exclusive Privileges</div>
                <div class="task-desc">3D Carousel Replica</div>
            </a>

            <a href="./TASK 2/index.html" class="task-link">
                <div class="task-number">2</div>
                <div class="task-name">Video Chapters</div>
                <div class="task-desc">YouTube Chapter System</div>
            </a>

            <a href="./TASK 3/index.html" class="task-link">
                <div class="task-number">3</div>
                <div class="task-name">Lead Capture Form</div>
                <div class="task-desc">6-Second Trigger Form</div>
            </a>
        </div>
    </div>
</body>
</html>
